<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>CrazyError Studio - Iconos Gráficos</title>
    <style>
        body {
            background-color: #1e1e1e;
            font-family: Tahoma, sans-serif;
            color: #fff;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
        }

        .control-panel {
            background: #2d2d2d;
            padding: 15px 20px;
            border-radius: 6px;
            margin-bottom: 25px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.3);
            display: flex;
            flex-direction: column;
            gap: 10px;
            width: 350px;
        }

        .control-panel label {
            font-size: 12px;
            color: #ccc;
        }

        .control-panel input, .control-panel select {
            background: #3c3c3c;
            border: 1px solid #555;
            color: #fff;
            padding: 6px;
            border-radius: 4px;
            font-family: Tahoma, sans-serif;
        }

        .window {
            width: 420px;
            transition: all 0.2s ease;
        }

        .title-bar {
            padding: 6px 10px;
            font-weight: bold;
            font-size: 13px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            user-select: none;
        }

        .window-controls {
            display: flex;
            align-items: center;
        }

        .win-btn {
            display: flex;
            justify-content: center;
            align-items: center;
            cursor: pointer;
            padding: 0;
        }

        .content {
            padding: 20px;
            display: flex;
            gap: 15px;
            align-items: flex-start;
        }

        /* Contenedor del Icono Gráfico */
        .icon-box {
            width: 36px;
            height: 36px;
            flex-shrink: 0;
            position: relative;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .text-box {
            font-size: 13px;
            line-height: 1.4;
            word-break: break-word;
        }

        .buttons-bar {
            padding: 10px;
            display: flex;
            justify-content: flex-end;
            gap: 8px;
        }

        /* --- ESTILOS DE VENTANA Y CONTROLES --- */

        /* Windows XP */
        .window.win-xp {
            background: #ece9d8;
            border: 3px solid #0054e3;
            box-shadow: 4px 4px 20px rgba(0,0,0,0.6);
            color: #000;
        }
        .window.win-xp .title-bar {
            background: linear-gradient(to right, #0054e3, #458fff);
            color: white;
        }
        .window.win-xp .window-controls { gap: 2px; }
        .window.win-xp .win-btn {
            width: 18px; height: 18px;
            background: #ece9d8;
            border: 1px solid #ffffff; border-right-color: #7f7f7f; border-bottom-color: #7f7f7f;
            color: #000; font-size: 10px; font-weight: bold;
        }
        .window.win-xp .win-btn.close { background: #e81123; color: white; border-color: #f07078; }
        .window.win-xp .buttons-bar { background: #f0f0f0; border-top: 1px solid #d4d0c8; }
        .window.win-xp .btn {
            padding: 4px 16px; font-family: Tahoma, sans-serif; font-size: 12px;
            background: #ece9d8; border: 1px solid #003c74; cursor: pointer; min-width: 75px; color: #000;
        }
        .window.win-xp .btn:hover { background: #e4e2d5; }

        /* Windows 7 */
        .window.win-7 {
            background: rgba(240, 240, 240, 0.95);
            border: 1px solid #555; border-radius: 8px 8px 0 0;
            box-shadow: 0 10px 25px rgba(0,0,0,0.5); color: #000; overflow: hidden;
        }
        .window.win-7 .title-bar {
            background: linear-gradient(to bottom, #e2e8f0, #adb9c9);
            color: #111; border-bottom: 1px solid #888; text-shadow: 0 1px 0 rgba(255,255,255,0.7);
        }
        .window.win-7 .window-controls { gap: 3px; }
        .window.win-7 .win-btn {
            width: 20px; height: 18px;
            background: linear-gradient(to bottom, #fff, #ccc);
            border: 1px solid #777; border-radius: 3px; color: #333; font-size: 10px;
        }
        .window.win-7 .win-btn.close { background: linear-gradient(to bottom, #e87b7b, #c42b2b); color: white; border-color: #a82020; }
        .window.win-7 .buttons-bar { background: #f0f0f0; border-top: 1px solid #dcdcdc; }
        .window.win-7 .btn {
            padding: 5px 16px; font-size: 12px;
            background: linear-gradient(to bottom, #fff, #e1e1e1); border: 1px solid #adadad; border-radius: 3px; cursor: pointer; color: #000;
        }
        .window.win-7 .btn:hover { background: linear-gradient(to bottom, #e8f2fe, #c4e0fc); border-color: #3c7fb1; }

        /* Windows 8 */
        .window.win-8 {
            background: #ffffff; border: 1px solid #007acc;
            box-shadow: 0 5px 15px rgba(0,0,0,0.3); color: #000;
        }
        .window.win-8 .title-bar { background: #ffffff; color: #000; font-weight: normal; }
        .window.win-8 .window-controls { gap: 0px; }
        .window.win-8 .win-btn { width: 25px; height: 20px; background: transparent; border: none; color: #666; font-size: 12px; }
        .window.win-8 .win-btn:hover { background: #e5e5e5; color: #000; }
        .window.win-8 .win-btn.close:hover { background: #e81123; color: white; }
        .window.win-8 .buttons-bar { background: #f5f5f5; }
        .window.win-8 .btn {
            padding: 6px 18px; font-size: 12px; background: #e1e1e1; border: 2px solid #e1e1e1; cursor: pointer; color: #000;
        }
        .window.win-8 .btn:hover { border-color: #007acc; background: #e5f1fb; }

        /* Windows 10 */
        .window.win-10 {
            background: #f0f0f0; border: 1px solid #cccccc;
            box-shadow: 0 4px 15px rgba(0,0,0,0.2); color: #000;
        }
        .window.win-10 .title-bar { background: #e6e6e6; color: #111; }
        .window.win-10 .window-controls { gap: 0px; }
        .window.win-10 .win-btn { width: 32px; height: 24px; background: transparent; border: none; color: #333; font-size: 10px; }
        .window.win-10 .win-btn:hover { background: rgba(0,0,0,0.1); }
        .window.win-10 .win-btn.close:hover { background: #e81123; color: white; }
        .window.win-10 .buttons-bar { background: #e5e5e5; }
        .window.win-10 .btn {
            padding: 6px 16px; font-size: 12px; background: #cccccc; border: 1px solid #adadad; cursor: pointer; color: #000;
        }
        .window.win-10 .btn:hover { background: #e5e5e5; border-color: #0078d7; }

        /* Windows 11 */
        .window.win-11 {
            background: #f3f3f3; border: 1px solid #d5d5d5; border-radius: 8px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.2); color: #1f1f1f; overflow: hidden;
        }
        .window.win-11 .title-bar { background: #f3f3f3; color: #1f1f1f; }
        .window.win-11 .window-controls { gap: 2px; }
        .window.win-11 .win-btn { width: 28px; height: 22px; background: transparent; border: none; color: #555; border-radius: 4px; font-size: 10px; }
        .window.win-11 .win-btn:hover { background: rgba(0,0,0,0.06); }
        .window.win-11 .win-btn.close:hover { background: #c42b1c; color: white; }
        .window.win-11 .buttons-bar { background: #ebebeb; border-top: 1px solid #e5e5e5; }
        .window.win-11 .btn {
            padding: 6px 18px; font-size: 12px; background: #ffffff; border: 1px solid #cccccc; border-radius: 4px; cursor: pointer; color: #1f1f1f;
        }
        .window.win-11 .btn:hover { background: #fcfcfc; border-color: #adadad; }
    </style>
</head>
<body>

    <div class="control-panel">
        <h3>CrazyError Studio</h3>
        
        <label>Versión de Windows:</label>
        <select id="selectStyle" onchange="updateWindow()">
            <option value="win-xp">Windows XP</option>
            <option value="win-7">Windows 7</option>
            <option value="win-8">Windows 8</option>
            <option value="win-10">Windows 10</option>
            <option value="win-11">Windows 11</option>
        </select>

        <label>Título de la ventana:</label>
        <input type="text" id="inputTitle" value="ERROR :v" oninput="updateWindow()">
        
        <label>Mensaje principal:</label>
        <input type="text" id="inputDesc" value="Ocurrió un error inesperado grave en su sistema" oninput="updateWindow()">
        
        <label>Tipo de Icono:</label>
        <select id="selectIcon" onchange="updateWindow()">
            <option value="warning">Advertencia (!)</option>
            <option value="error">Error crítico (X)</option>
            <option value="info">Información (i)</option>
            <option value="question">Pregunta (?)</option>
        </select>

        <label>Texto Botón 1:</label>
        <input type="text" id="inputBtn1" value="Entrar modo recuperacion" oninput="updateWindow()">

        <label>Texto Botón 2:</label>
        <input type="text" id="inputBtn2" value="Apagar" oninput="updateWindow()">
    </div>

    <!-- Contenedor de la ventana -->
    <div class="window win-xp" id="mainWindow">
        <div class="title-bar">
            <span id="previewTitle">ERROR :v</span>
            <div class="window-controls" id="windowControlsContainer"></div>
        </div>
        <div class="content">
            <div class="icon-box" id="previewIcon"></div>
            <div class="text-box" id="previewDesc">
                Ocurrió un error inesperado grave en su sistema
            </div>
        </div>
        <div class="buttons-bar">
            <button class="btn" id="previewBtn1">Entrar modo recuperacion</button>
            <button class="btn" id="previewBtn2">Apagar</button>
        </div>
    </div>

    <script>
        function updateWindow() {
            const win = document.getElementById('mainWindow');
            const styleChoice = document.getElementById('selectStyle').value;
            const controlsContainer = document.getElementById('windowControlsContainer');
            const iconBox = document.getElementById('previewIcon');
            const iconType = document.getElementById('selectIcon').value;
            
            // Cambiar clase principal
            win.className = "window " + styleChoice;

            // Botones de ventana según SO
            let minSymbol = "_";
            let maxSymbol = "□";
            let closeSymbol = "×";
            if (styleChoice === 'win-8' || styleChoice === 'win-10' || styleChoice === 'win-11') {
                minSymbol = "🗕";
                maxSymbol = "🗖";
            }
            controlsContainer.innerHTML = `
                <button class="win-btn">${minSymbol}</button>
                <button class="win-btn">${maxSymbol}</button>
                <button class="win-btn close">${closeSymbol}</button>
            `;

            // Generar el ICONO GRÁFICO A COLOR según el tipo seleccionado
            let svgContent = "";
            if (iconType === 'error') {
                // X Roja / Crítico
                svgContent = `<svg width="36" height="36" viewBox="0 0 32 32">
                    <circle cx="16" cy="16" r="15" fill="#e81123" stroke="#b30d1a" stroke-width="1"/>
                    <path d="M10 10 L22 22 M22 10 L10 22" stroke="white" stroke-width="3" stroke-linecap="round"/>
                </svg>`;
            } else if (iconType === 'warning') {
                // Triángulo Amarillo con !
                svgContent = `<svg width="36" height="36" viewBox="0 0 32 32">
                    <polygon points="16,2 30,30 2,30" fill="#fce94f" stroke="#c4a000" stroke-width="2" stroke-linejoin="round"/>
                    <rect x="14.5" y="11" width="3" height="9" rx="1.5" fill="#2e3436"/>
                    <circle cx="16" cy="24" r="1.5" fill="#2e3436"/>
                </svg>`;
            } else if (iconType === 'info') {
                // Círculo Azul con i
                svgContent = `<svg width="36" height="36" viewBox="0 0 32 32">
                    <circle cx="16" cy="16" r="15" fill="#3498db" stroke="#2980b9" stroke-width="1"/>
                    <rect x="14.5" y="13" width="3" height="11" rx="1" fill="white"/>
                    <circle cx="16" cy="9.5" r="1.5" fill="white"/>
                </svg>`;
            } else if (iconType === 'question') {
                // Círculo Celeste/Azul con ?
                svgContent = `<svg width="36" height="36" viewBox="0 0 32 32">
                    <circle cx="16" cy="16" r="15" fill="#1abc9c" stroke="#16a085" stroke-width="1"/>
                    <path d="M11 12 C11 8, 21 8, 21 12 C21 15, 16 15, 16 19" stroke="white" stroke-width="3" fill="none" stroke-linecap="round"/>
                    <circle cx="16" cy="23" r="1.5" fill="white"/>
                </svg>`;
            }
            iconBox.innerHTML = svgContent;

            // Textos y botones
            document.getElementById('previewTitle').innerText = document.getElementById('inputTitle').value;
            document.getElementById('previewDesc').innerText = document.getElementById('inputDesc').value;
            document.getElementById('previewBtn1').innerText = document.getElementById('inputBtn1').value;
            document.getElementById('previewBtn2').innerText = document.getElementById('inputBtn2').value;
        }

        updateWindow();
    </script>

</body>
</html>
